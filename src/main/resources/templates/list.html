<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>All Bookings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="p-4"><div class="container"><h3>All Bookings</h3><table class="table table-striped"><thead><tr><th>ID</th><th>Name</th><th>Train</th><th>From</th><th>To</th><th>Coach</th><th>Seat</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td th:text="${b.id}"></td><td th:text="${b.name}"></td><td th:text="${b.train}"></td><td th:text="${b.source}"></td><td th:text="${b.destination}"></td><td th:text="${b.coach}"></td><td th:text="${b.seat}"></td></tr></tbody></table><a href="/" class="btn btn-link">Back</a></div></body></html>
