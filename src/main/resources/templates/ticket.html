<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Ticket</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="p-4"><div class="container"><div class="card p-4 shadow"><h3>Booking Confirmed</h3><p><strong>Booking ID:</strong> <span th:text="${booking.id}"></span></p><p><strong>Name:</strong> <span th:text="${booking.name}"></span></p><p><strong>Train:</strong> <span th:text="${booking.train}"></span></p><p><strong>From:</strong> <span th:text="${booking.source}"></span> <strong>To:</strong> <span th:text="${booking.destination}"></span></p><p><strong>Coach:</strong> <span th:text="${booking.coach}"></span> <strong>Seat:</strong> <span th:text="${booking.seat}"></span></p><p><strong>Date:</strong> <span th:text="${booking.date}"></span></p><p><strong>Email:</strong> <span th:text="${booking.email}"></span></p><a th:href="@{'/ticket/pdf/' + ${booking.id}}" class="btn btn-primary">Download PDF</a> <a href="/" class="btn btn-link">Back to Search</a></div></div></body></html>
